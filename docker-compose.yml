services:
  db:
    image: postgres:16-alpine
    container_name: zastolom-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: zastolom
      POSTGRES_USER: zastolom_app
      POSTGRES_PASSWORD: ${ZASTOLOM_POSTGRES_PASSWORD:?ZASTOLOM_POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - zastolom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zastolom_app -d zastolom"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  zastolom_pgdata:
    name: zastolom_pgdata
